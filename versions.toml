# Pinned versions for every harness and tool this repo installs or checks.
#
# Existing pins resolved 2026-11-04; tools-stage additions resolved 2026-11-05 (docs/research.md).
# Re-resolve from the registry before you bump a pin; never bump from memory.
#
# Format contract (scripts/preflight, scripts/verify and run_onchange_ scripts parse this file
# with a line reader, not a TOML library, so keep to it):
#   - one [section] per item, named [<area>.<name>]
#   - flat `key = "value"` lines only, double-quoted, no inline tables or arrays
#   - `version` is the pin; `observed` is what a machine reported when it was not resolvable
#     from a registry; `source` is the registry or release URL the pin came from
#   - [overrides.<machine>] sections pin a different version on one machine (key = tool name)
#
# Templates read it with:
#   {{ $versions := include (joinPath .repoDir "versions.toml") | fromToml }}
# and run_onchange_ scripts hash it with:
#   # versions.toml: {{ include (joinPath .repoDir "versions.toml") | sha256sum }}

[meta]
resolved = "2026-11-04"

# ---- Harnesses ---------------------------------------------------------------

[harness.claude]
version = "2.1.318"
source = "https://www.npmjs.com/package/@anthropic-ai/claude-code"
package = "@anthropic-ai/claude-code"

[harness.codex]
version = "0.166.0"
source = "https://www.npmjs.com/package/@openai/codex"
package = "@openai/codex"

[harness.grok]
# No public registry found; pin is what Beast and server report (`grok --version`). [UNVERIFIED]
version = "1.0.70"
observed = "1.0.70 (f50904eaee6c) [stable]"
source = "observed"

[harness.muse]
# No public registry found; pin is what Beast and server report (`muse --version`). [UNVERIFIED]
version = "1.4.14"
observed = "Muse Code 1.4.14 (1.4.14-R7309.1)"
source = "observed"

