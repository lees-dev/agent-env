# winget OpenJS.NodeJS.LTS has no 24.22.2 manifest yet (newest 24.x is 24.22.1 on 2026-11-04).
winget = "24.22.1"

[tools.uv]
version = "0.13.7"
source = "https://github.com/astral-sh/uv/releases/tag/0.13.7"

[tools.python]
# Python 3.13 for general use. Linux/macOS: `uv python install 3.13` (newest patch uv knows).
# Windows: winget Python.Python.3.13 (python.org installer, gives `py` and `python`).
version = "3.13.18"
minor = "3.13"
source = "https://www.python.org/downloads/release/python-31318/"
winget = "3.13.17"

[tools.python312]
# Python 3.12 for repos that pin it (server). Every OS: `uv python install 3.12`.
# python.org ships no Windows installer for 3.12 security releases, so winget stops at 3.12.10.
version = "3.12.16"
minor = "3.12"
source = "https://www.python.org/downloads/release/python-31216/"

[tools.mise]
version = "2026.11.0"
source = "https://github.com/jdx/mise/releases/tag/v2026.11.0"

[tools.oh-my-posh]
version = "31.9.1"
source = "https://github.com/JanDeDobbeleer/oh-my-posh/releases/tag/v31.9.1"

[tools.coderabbit]
# Linux and macOS only (no Windows build). Installer: https://cli.coderabbit.ai/install.sh
version = "0.9.2"
source = "https://cli.coderabbit.ai/install.sh"

[tools.pwsh]
# Optional. Every .ps1 in this repo must also run on Windows PowerShell 5.1.
version = "7.6.9"
source = "https://github.com/PowerShell/PowerShell/releases/tag/v7.6.9"

[tools.winget]
version = "1.29.380"
source = "https://github.com/microsoft/winget-cli/releases/tag/v1.29.380"

# ---- Hub only -------------------------------------------------------------------

[hub.cliproxyapi]
# Upstream core. Beast runs it inside the EasyCLIProxyAPI GUI, which updates the core itself,
# so `version` records what Beast ran on 2026-11-04 and `latest` what upstream had released.
# Nothing installs the core from this pin yet (docs/cpa.md, "Stable install path").
version = "8.0.54"
source = "https://github.com/router-for-me/CLIProxyAPI/releases/tag/v8.0.54"
latest = "8.0.55"
latest_source = "https://github.com/router-for-me/CLIProxyAPI/releases/tag/v8.0.55"

[hub.easycliproxyapi]
# The GUI that runs the core. install_dir is the default relative to home; persist a
# machine-local CPA_APP_DIR override before apply when restoring to another location.
version = "0.3.73"
source = "https://github.com/router-for-me/EasyCLIProxyAPI/releases/tag/v0.3.73"
latest = "0.3.74"
latest_source = "https://github.com/router-for-me/EasyCLIProxyAPI/releases/tag/v0.3.74"
install_dir = "Downloads/EasyCLIProxyAPI-v0.3.73-Windows-amd64/EasyCLIProxyAPI-v0.3.73-Windows-amd64"
listen = "127.0.0.1:8317"

[hub.rebalancer]
# Scheduled task "CPA Soonest-Reset Rebalancer" (run_onchange_after_40-cpa-rebalancer-task.ps1).
version = "2026-11-04"
source = "observed"
interval_minutes = "5"
time_limit_minutes = "4"

