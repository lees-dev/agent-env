# Harness settings agent-env manages (harness area). Not deployed: the modify_ templates,
# run scripts and scripts/verify.d/30-harness.checks.tmpl read it with
#   includeTemplate "harness/config.toml" . | fromToml
# The same values apply on every machine. To change one machine only, add a
# [machines.<machine remark>] table that repeats the harness table and key, for example:
#   [machines.server.codex]
#   model = "gpt-6-astra"
#   effort = "medium"
# No secrets here, ever: every harness gets the CPA client key from the cpa helper
# (partial harness/cpa-token-path). The helper prints ~/.config/agent-env/cpa-key, which chezmoi
# writes from 1Password at apply time (docs/cpa.md); nothing reads 1Password per harness call.
# Plain TOML with no template actions, so it renders as itself.

[claude]
# ~/.claude/settings.json
model = "opus"
# modelSettings.<effort_model>.effortLevel
effort_model = "claude-opus-5-5"
effort = "high"
output_style = "Concise"
ultracode = true
# How long Claude Code caches the apiKeyHelper output. The key is static, and a 401 or 403
# re-runs the helper anyway, so a long TTL only saves 1Password round trips. String: env value.
api_key_helper_ttl_ms = "43200000"
# env.DISABLE_AUTOUPDATER = "1": the native build would otherwise update itself off the
# versions.toml pin, and scripts/verify fails on drift (docs/packages.md). Integration, 2026-11-04.
disable_autoupdater = true
# The pr-workflow PreToolUse hook (skill owned by rules+skills, in ~/.agents/skills).
hook_matcher = "Bash|PowerShell"
hook_timeout = 10
statusline_theme = ".config/ohmyposh/claude-statusline.omp.json"
# enabledPlugins, installed by run_onchange_after_32-harness-claude-plugins.
plugins = [
  "mattpocock-skills@mattpocock",
  "vercel@claude-plugins-official",
  "frontend-design@anthropic-plugin-directory",
  "code-review-anthropics@anthropic-plugin-directory",
  "context7@anthropic-plugin-directory",
  "skill-creator@anthropic-plugin-directory",
  "code-simplifier@anthropic-plugin-directory",
  "playwright@anthropic-plugin-directory",
  "claude-md-management@anthropic-plugin-directory",
  "feature-dev@anthropic-plugin-directory",
  "claude-code-setup@anthropic-plugin-directory",
  "figma@claude-plugins-official",
  "commit-commands@anthropic-plugin-directory",
  "chrome-devtools-mcp@claude-plugins-official",
]

# extraKnownMarketplaces. anthropic-plugin-directory is built in and needs no entry.
[claude.marketplaces.mattpocock]
repo = "mattpocock/skills"
auto_update = true

[claude.marketplaces.claude-plugins-official]
repo = "anthropics/claude-plugins-official"

# User-scope MCP servers, added with `claude mcp add --scope user` (never by writing ~/.claude.json).
[claude.mcp.linear-server]
url = "https://mcp.linear.app/mcp"

[codex]
# ~/.codex/config.toml
provider = "cpa"
provider_name = "CLIProxyAPI"
wire_api = "responses"
supports_websockets = true
request_max_retries = 10
stream_max_retries = 10
model = "gpt-6.1-sol"
effort = "high"
# model_providers.cpa.auth: the helper prints the key; Codex sends it as a bearer token.
auth_timeout_ms = 60000
auth_refresh_interval_ms = 43200000
# Providers from before agent-env. They carry a plaintext key, so apply removes them.
legacy_providers = ["cpa-gui"]
analytics_enabled = false
feedback_enabled = false

# MCP servers set in config.toml. `codex mcp add` is not used: it starts a blocking OAuth
# flow (tested on 0.166.0). Sign in once with `codex mcp login linear`.
[codex.mcp.linear]
url = "https://mcp.linear.app/mcp"

[grok]
# ~/.grok/config.toml
model = "grok-4.7-build-fast"
auth_token_ttl = 86400

[muse]
# ~/.config/muse/settings.json
provider = "meta"
model = "muse-wonder-full-1.0"
effort = "high"
auth = "bearer"

[[muse.catalog]]
model_id = "muse-wonder-full-1.0"
display_label = "Muse Wonder Full 1.0"
is_default = true
provider_id = "meta"
profile_id = "tbh"
context_limit = 1007997
output_limit = 128000
background_agent_model = "muse-spark-1.3"

