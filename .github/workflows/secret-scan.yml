# Secret and privacy scan for every push and pull request.
#
# gitleaks runs as the pinned release binary (checksum-verified), not gitleaks-action:
# lees-dev is a GitHub Organization, and gitleaks-action v2+ needs a paid-tier GITLEAKS_LICENSE
# secret for organization repos. Same engine, no license. Details: docs/research.md.
# Versions live in versions.toml ([ci.gitleaks], [ci.shellcheck], [ci.actions-checkout]); bump this file and versions.toml together.
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          set -eu
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan history
        # --redact keeps matched values out of the log.
        run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --exit-code 1 .'

  guard:
    name: guard (keys, emails, forbidden files, line endings, syntax)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Keep in step with versions.toml [ci.shellcheck]. Pinned so the runner image's own
      # shellcheck cannot change what check.sh reports.
      SHELLCHECK_VERSION: "0.11.0"
      SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          set -eu
          f="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/$f"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" --version
      - name: secret guard
        run: sh scripts/secret-guard.sh
      - name: repo checks
        run: sh scripts/check.sh --no-guard

  render:
    name: render (chezmoi into a throwaway home, no 1Password)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Keep in step with versions.toml [tools.chezmoi]; sha256 of chezmoi_<v>_linux_amd64.tar.gz
      # from the release's checksums.txt.
      CHEZMOI_VERSION: "2.74.0"
      CHEZMOI_SHA256: "1b98a567f726f41540414aea4caf912699d53e248b29ccf8369cf553657b2374"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install chezmoi ${{ env.CHEZMOI_VERSION }}
        run: |
          set -eu
          f="chezmoi_${CHEZMOI_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/twpayne/chezmoi/releases/download/v${CHEZMOI_VERSION}/$f"
          echo "${CHEZMOI_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" chezmoi
      - name: render test (docs/testing.md)
        run: sh scripts/render-test.sh --chezmoi "$RUNNER_TEMP/chezmoi"
