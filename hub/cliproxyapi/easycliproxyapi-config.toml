locale = "en"
port = 8317
allow-lan = false
host = "127.0.0.1"
run-on-startup = true
start-core-on-launch = true
silent-start = false
close-behavior = "ask"
default-terminal = "auto"
auth-dir = "../oauth"
auth-dir-user-selected = false
management-secret-key = "<MANAGEMENT_KEY>"
debug = false
commercial-mode = false
logging-to-file = false
logs-max-total-size-mb = 0
error-logs-max-files = 10
usage-statistics-enabled = true
redis-usage-queue-retention-seconds = 60
request-log = false
plugins-enabled = true
routing-strategy = "fill-first"
proxy-url = ""
proxy-override = false
download-source = "github"
prefer-gitcode-downloads = false
routing-session-affinity = true
routing-session-affinity-ttl = ""
disable-cooling = false
request-retry = 3
max-retry-credentials = 0
max-retry-interval = 30
streaming-bootstrap-retries = 1
api-keys = [{ key = "<CLIENT_KEY>", remark = "<machine remark>" }]
custom-download-mirrors = []
active-custom-download-mirror = ""
api-access-remarks = []
